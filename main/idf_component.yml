version: "1.0.0"

dependencies:
  espressif/esp_lcd_touch: "^1.1.2"
  idf: ">5.0.4,!=5.1.1"

  espressif/esp_jpeg:
    version: "^1.3.1"

  chmorgan/esp-libhelix-mp3:
    version: "^1.0.3"

  lvgl/lvgl:
    version: "9.4.0"
    public: true

  # 系统字体为 NPF1 位图全字库（font 分区里的 spiffs/system.npf，运行时 mmap），
  # 不再依赖 espressif/freetype（2026-11 从 TTF 改回位图时删除）。
  #
  # ⚠ 已删除 esp_lcd_sh8601（2026-11）：本项目显示驱动是本地组件
  #   components/esp_lcd_qspi_amoled（由 SH8601 派生后独立维护），main 与各组件
  #   里都没有任何代码 include esp_lcd_sh8601.h，它只是历史遗留的 public 依赖，
  #   白白参与构建（1 个编译单元）并拉进 cmake_utilities 之外的额外依赖。
